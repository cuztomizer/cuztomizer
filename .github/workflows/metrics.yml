name: Metrics

on:
  schedule:
    # Daily at 11:00 UTC (morning in America/New_York).
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check for METRICS_TOKEN
        id: token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "METRICS_TOKEN is unset. The README keeps the placeholder chart until this secret exists."
          fi

      - name: Render GitHub metrics
        if: steps.token.outputs.present == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cuztomizer
          filename: github-metrics.svg
          output_action: commit
          committer_message: Update GitHub metrics
          config_timezone: America/New_York
          # Lifetime totals. A user token with repo scope adds private contributions
          # (restrictedContributionsCount) and organization commits. This path does
          # not use the Search API, which stops at 1,000 commits.
          base: header, activity, community, repositories
          base_indepth: yes
          # Private owned and collaborator repos are counted, not named.
          # organization_member is left off so the card does not inventory every
          # repository in an org. Org commits still count in activity and the calendar.
          repositories_affiliations: owner, collaborator
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_repositories: no
          plugin_projects: no
          plugin_notable: no
